# Fly.io config. `fly launch --copy-config --no-deploy` then follow docs/deploy.md.
app = "jarvis-command-center"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  JARVIS_DB = "/data/jarvis.db"
  JARVIS_HOST = "0.0.0.0"
  PORT = "8080"

[[mounts]]
  source = "jarvis_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
